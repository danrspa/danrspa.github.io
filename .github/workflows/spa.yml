# ᛋᛈᚨ · helgisiðr vikunnar — vǫlvan vaknar, heyrir á heiminn, ok kveðr.
name: Spá vikunnar

on:
  schedule:
    - cron: "0 6 * * 1"        # hvern mánadag at dögun (06:00 UTC)
  workflow_dispatch:           # vekja vǫlvuna at vild
  push:
    branches: [main]
    paths:
      - "mot/**"
      - "seidr/**"
      - "hof/stafir.css"

permissions:
  contents: write              # rísta nýja spá í annálana
  pages: write                 # birta hofit heiminum
  id-token: write              # krafa deploy-pages

concurrency:
  group: spa-vikunnar
  cancel-in-progress: false

jobs:
  kveda:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.birta.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Brunnarnir. Hverr sem settr er, verðr reyndr í rǫð (sjá seidr/andi.py).
      # Þagni allir — fellr þetta skref, ok hofit stendr sem þat stóð.
      # Engi gǫmul spá er borin fram sem ný; þat var sǫk vikna 32-38.
      - name: Vǫlvan kveðr
        id: kveda
        continue-on-error: true
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY:    ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
        run: python seidr/vala.py

      # Ritat ávallt — líka þótt vǫlvan hafi þagat. Þǫgnin sjálf er gjǫrð í
      # geymslunni, ok heldr helgisiðnum lifandi (60-daga reglan).
      - name: Rísta í annálana
        if: always()
        run: |
          git config user.name  "Vǫlva"
          git config user.email "volva@users.noreply.github.com"
          git add hof/spa.json hof/annalar.json hof/index.html hof/salr.html hof/heilsa.json
          if git diff --cached --quiet; then
            echo "Engi ný spá at rísta."
          else
            git commit -m "$(test -f hof/spa.json && grep -q '\"þǫgn\": true' hof/heilsa.json && echo "þǫgn: $(date -u +%G-V%V)" || echo "spá: $(date -u +%G-V%V)")"
            git push
          fi

      # Hjartsláttrinn var ritaðr, en engi hlýddi á hann. Þagni vǫlvan meir en
      # átta daga, þá skal þat sjást — eigi eftir sjau vikur sem fyrr.
      - name: Hlýða á hjartaslátt
        if: always()
        run: |
          python - <<'PY'
          import json, sys, datetime
          try:
              h = json.load(open("hof/heilsa.json", encoding="utf-8"))
          except Exception as e:
              sys.exit(f"Engi hjartsláttr fannst: {e}")
          síðast = datetime.datetime.strptime(
              h["síðasta_spá"], "%Y-%m-%dT%H:%M:%SZ"
          ).replace(tzinfo=datetime.timezone.utc)
          dagar = (datetime.datetime.now(datetime.timezone.utc) - síðast).days
          print(f"Síðasta spá: {h['vika']} ({h['brunnr']}), fyrir {dagar} dǫgum.")
          if dagar > 8:
              sys.exit(f"Vǫlvan hefir þagat í {dagar} daga. Helgisiðrinn fellr.")
          PY

      - name: Þagði vǫlvan?
        if: steps.kveda.outcome == 'failure'
        run: |
          echo "Vǫlvan þagði þessa viku. Þǫgnin er rituð; engi spá birt."
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hof
      - id: birta
        uses: actions/deploy-pages@v4
