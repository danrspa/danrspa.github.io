# Bráðabirgða: kanna hverjir brunnar svara ór hofi GitHub, eigi ór borði mínu.
name: Kanna brunna
on:
  workflow_dispatch:
jobs:
  kanna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          A = "{http://www.w3.org/2005/Atom}"
          K = {
            "Iceland Monitor": "https://icelandmonitor.mbl.is/rss/",
            "RUV (IS)":        "https://www.ruv.is/rss/frettir",
            "DR (DK)":         "https://www.dr.dk/nyheder/service/feeds/allenyheder",
            "SVT (SE)":        "https://www.svt.se/rss.xml",
            "Helsinki Times":  "https://www.helsinkitimes.fi/?format=feed&type=rss",
            "YLE (FI)":        "https://yle.fi/rss/uutiset/paauutiset",
            "NRK (current)":   "https://www.nrk.no/toppsaker.rss",
            "Iceland Review":  "https://www.icelandreview.com/feed/",
            "The Local SE":    "https://www.thelocal.se/feeds/rss.php",
            "Meduza EN":       "https://meduza.io/rss/en/all",
            "RTV Utrecht":     "https://www.rtvutrecht.nl/rss/nieuws.xml",
            "AD Utrecht":      "https://www.ad.nl/utrecht/rss.xml",
            "Freedom News":    "https://freedomnews.org.uk/feed/",
            "CrimethInc":      "https://crimethinc.com/feed",
            "BBC world":       "https://feeds.bbci.co.uk/news/world/rss.xml",
            "Al Jazeera":      "https://www.aljazeera.com/xml/rss/all.xml",
          }
          def items(u):
              rq = urllib.request.Request(u, headers={"User-Agent": "vala/1.0 (+heimr)"})
              raw = urllib.request.urlopen(rq, timeout=15).read()
              r = ET.fromstring(raw); out = []
              for it in r.iter("item"):
                  t = it.find("title")
                  if t is not None and t.text and t.text.strip(): out.append(t.text.strip())
              if not out:
                  for e in r.iter(A + "entry"):
                      t = e.find(A + "title")
                      if t is not None and t.text: out.append(t.text.strip())
              return out
          for n, u in K.items():
              try:
                  it = items(u)
                  print(f"OK   {n:17s} {len(it):3d} | {it[0][:50] if it else '-'}")
              except Exception as e:
                  print(f"FAIL {n:17s} {type(e).__name__}: {str(e)[:60]}")
          PY
